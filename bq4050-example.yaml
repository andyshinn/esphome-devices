esphome:
  name: bq4050-monitor
  platform: ESP32
  board: nodemcu-32s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:

ota:

external_components:
  - source:
      type: local
      path: external_components

i2c:
  sda: 21
  scl: 22
  scan: true

bq4050:
  update_interval: 30s

sensor:
  - platform: bq4050
    voltage:
      name: "Battery Voltage"
      id: battery_voltage
    current:
      name: "Battery Current"
      id: battery_current
    temperature:
      name: "Battery Temperature"
      id: battery_temperature
    state_of_charge:
      name: "Battery SoC"
      id: battery_soc
    remaining_capacity:
      name: "Battery Remaining Capacity"
      id: battery_remaining
    full_charge_capacity:
      name: "Battery Full Charge Capacity"
      id: battery_full_capacity
    cycle_count:
      name: "Battery Cycle Count"
      id: battery_cycles
    battery_status:
      name: "Battery Status"
      id: battery_status
    cell1_voltage:
      name: "Cell 1 Voltage"
      id: cell1_voltage
    cell2_voltage:
      name: "Cell 2 Voltage"
      id: cell2_voltage
    cell3_voltage:
      name: "Cell 3 Voltage" 
      id: cell3_voltage
    cell4_voltage:
      name: "Cell 4 Voltage"
      id: cell4_voltage

  # Calculate power from voltage and current
  - platform: template
    name: "Battery Power"
    id: battery_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    lambda: |-
      if (id(battery_voltage).has_state() && id(battery_current).has_state()) {
        return id(battery_voltage).state * id(battery_current).state;
      }
      return {};
    update_interval: 30s