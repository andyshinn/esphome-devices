# ---------------------------------------------------------------------------
# Cubii Go -- replacement console
# Adafruit ESP32-S2 Feather + 0.96" I2C OLED (SSD1306)
#
# GPIO7 gates the STEMMA QT rail and its pull-ups (HIGH = on, measured).
# It MUST be a power_supply, not a gpio switch: power_supply sets up at
# priority 1200, ahead of the I2C bus at 1000, and its enable_time is a
# blocking delay. A gpio switch runs at 800 -- after the bus -- and offers
# no settling delay, so the SSD1306 gets probed before its power-on reset
# finishes and is marked FAILED permanently.
#
# Buttons:  [<]  [>]  [SCAN/RESET]   E-Switch LP1, 8mm snap-in, illuminated.
# All three LEDs share GPIO17 through one LEDC channel: GPIO17 -> 390R (one
# per LED) -> anode, cathodes to GND. Vf 2.1V, ~3.1 mA each, ~9.2 mA total,
# well under the 20 mA pin drive strength. Each LED needs its OWN resistor.
# ---------------------------------------------------------------------------

substitutions:
  reed_pin: GPIO18
  prev_button_pin: GPIO5      # <  page left
  next_button_pin: GPIO9      # >  page right
  action_button_pin: GPIO6    # tap = SCAN, hold 2s = reset
  i2c_power_pin: GPIO7
  sda_pin: GPIO3
  scl_pin: GPIO4

  meters_per_stride: "1.7"
  kcal_per_stride: "0.06"

  # Metric:   dist_unit "km", dist_factor "0.001"
  # Imperial: dist_unit "mi", dist_factor "0.000621371"
  dist_unit: "mi"
  dist_factor: "0.000621371"

  idle_timeout: 12s
  debounce: 200ms
  scan_interval: 8s
  screen_timeout: 3min
  ha_interval: 30s          # how often anything reaches Home Assistant

  # Lifetime odometer: the only continuously-changing value written to flash.
  # The restoring global is a PollingComponent -- update_interval is how often
  # it memcmps itself against the stored copy and queues an NVS write, so a
  # power cut can cost at most this much pedaling. Everything else persisted
  # here changes once a day and polls at 1s for free.
  odo_flush: 10min

  timezone: America/Chicago
  daily_reset_hour: "4"       # local hour the day rolls over (0-23)
  daily_goal_default: "3000"  # only applies on a fresh NVS; live in HA after

esphome:
  name: cubii-go
  friendly_name: Cubii Go
  area: Office
  on_boot:
    # 600 is below the globals component's HARDWARE (800), so the restored
    # odometer is already loaded by the time this runs.
    - priority: 600
      then:
        - lambda: 'id(session_start_strides) = id(odo_strides);'
        - script.execute: screen_wake

esp32:
  board: adafruit_feather_esp32s2
  variant: ESP32S2
  framework:
    type: esp-idf

logger:
  hardware_uart: UART0

api:
  encryption:
    key: !secret cubii_go__encryption_key
ota:
  - platform: esphome
    password: !secret cubii_go__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Cubii Fallback
    password: !secret wifi_password

captive_portal:

# SNTP rather than the homeassistant source: the daily rollover keeps working
# with HA down, and it is the clock that decides which day a stride belongs to.
time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      - script.execute: check_rollover

power_supply:
  - id: i2c_power
    pin: ${i2c_power_pin}
    enable_on_boot: true
    enable_time: 100ms

switch:
  - platform: template
    id: scan_mode
    name: "SCAN Mode"
    icon: mdi:autorenew
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

i2c:
  sda: ${sda_pin}
  scl: ${scl_pin}
  scan: true
  id: bus_a
  frequency: 400kHz

# ---------------------------------------------------------------------------
# Persistence model
#
# pulse_meter's total is boot-relative, so it cannot be the lifetime figure.
# odo_strides is: every publish of total_strides adds the delta to it, and the
# global flushes to NVS every ${odo_flush}.
#
# Nothing daily is counted separately. day_start_odo is the odometer reading
# at the last rollover and day_start_secs the lifetime pedaling seconds at the
# same instant, so today = lifetime - snapshot. Those snapshots only move once
# a day, which is why they can poll at 1s without touching flash: the poll is a
# memcmp, and a write is only queued when the value actually changed.
# ---------------------------------------------------------------------------
globals:
  # Lifetime strides. Survives reboots; written every ${odo_flush}.
  - id: odo_strides
    type: float
    restore_value: yes
    update_interval: ${odo_flush}
    initial_value: '0'

  # Last value seen from pulse_meter's boot-relative total, for the delta.
  - id: last_raw_total
    type: float
    restore_value: no
    initial_value: '0'

  # Logical date (YYYYMMDD, shifted back ${daily_reset_hour}h) of the current
  # day. 0 means "never had a valid clock yet".
  - id: day_stamp
    type: uint32_t
    restore_value: yes
    initial_value: '0'

  - id: day_start_odo
    type: float
    restore_value: yes
    initial_value: '0'

  - id: day_start_secs
    type: float
    restore_value: yes
    initial_value: '0'

  - id: yesterday_strides
    type: float
    restore_value: yes
    initial_value: '0'

  - id: yesterday_secs
    type: float
    restore_value: yes
    initial_value: '0'

  # Latched for the day, so raising the goal after hitting it does not
  # retroactively un-hit it, and a reboot does not re-fire the automation.
  - id: day_goal_hit
    type: bool
    restore_value: yes
    initial_value: 'false'

  - id: session_start_strides
    type: float
    restore_value: no
    initial_value: '0'

  - id: screen_awake
    type: bool
    restore_value: no
    initial_value: 'true'

# ---------------------------------------------------------------------------
# Sensors are split in two:
#   internal: true  -> fast, feeds the OLED, never reaches Home Assistant
#   named           -> mirrors of those, published every ${ha_interval}
# ---------------------------------------------------------------------------
sensor:
  - platform: pulse_meter
    id: stride_rate
    internal: true
    pin:
      number: ${reed_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    unit_of_measurement: "RPM"
    accuracy_decimals: 0
    # PULSE, not EDGE. The reed bounces ~8 electrical edges per revolution
    # (measured with the ESP32 PCNT peripheral, unfiltered). EDGE mode absorbed
    # that only by holding a 210ms blackout after each count, and the
    # closed window scales with cadence -- so at slow pedaling the break chatter
    # landed outside the blackout and counted a second stride.
    #
    # PULSE is level-based instead of time-since-last-count: it latches only
    # when the contact holds closed for >= ${debounce}, and re-arms only when it
    # holds open for >= ${debounce}. A bounce burst satisfies neither, so it is
    # rejected outright, and the behaviour is the same at 10 RPM and 110 RPM
    # because there is no cadence-dependent window.
    #
    # This only works because the filter is SHORT. At the old 210ms it would
    # count nothing at all -- the closed window is only 38-120ms.
    internal_filter: ${debounce}
    internal_filter_mode: PULSE
    timeout: ${idle_timeout}
    total:
      id: total_strides
      internal: true
      unit_of_measurement: "strides"
      accuracy_decimals: 0
      on_value:
        - script.execute: refresh_display
        - lambda: |-
            if (isnan(x)) return;
            float d = x - id(last_raw_total);
            if (d < 0) d = x;          // pulse_meter total restarted
            if (d > 0) id(odo_strides) += d;
            id(last_raw_total) = x;

  - platform: template
    id: disp_strides
    internal: true
    update_interval: 1s
    lambda: 'return id(odo_strides) - id(session_start_strides);'

  - platform: template
    id: disp_distance
    internal: true
    update_interval: 1s
    lambda: |-
      if (isnan(id(total_strides).state)) return 0.0f;
      return (id(total_strides).state - id(session_start_strides))
             * ${meters_per_stride} * ${dist_factor};

  - platform: template
    id: disp_calories
    internal: true
    update_interval: 1s
    lambda: |-
      if (isnan(id(total_strides).state)) return 0.0f;
      return (id(total_strides).state - id(session_start_strides))
             * ${kcal_per_stride};

  # Today = lifetime - the snapshot taken at the last rollover. Also where the
  # goal latch is set, so it happens on the same 1s cadence the display reads.
  - platform: template
    id: disp_day_strides
    internal: true
    update_interval: 1s
    lambda: |-
      float v = id(odo_strides) - id(day_start_odo);
      if (v < 0) v = 0;
      float goal = id(daily_goal).state;
      if (!id(day_goal_hit) && !isnan(goal) && goal > 0 && v >= goal) {
        id(day_goal_hit) = true;
        ESP_LOGI("cubii", "daily goal reached: %.0f / %.0f strides", v, goal);
      }
      return v;

  - platform: duty_time
    id: session_time
    internal: true
    update_interval: 1s
    sensor: is_pedaling
    restore: false

  - platform: template
    name: "Cadence"
    unit_of_measurement: "RPM"
    icon: mdi:speedometer
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 1s
    lambda: 'return isnan(id(stride_rate).state) ? 0.0f : id(stride_rate).state;'
    filters:
      - throttle_average: ${ha_interval}

  - platform: template
    name: "Total Strides"
    unit_of_measurement: "strides"
    icon: mdi:shoe-print
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: ${ha_interval}
    lambda: 'return id(odo_strides);'

  - platform: template
    name: "Session Strides"
    unit_of_measurement: "strides"
    icon: mdi:shoe-print
    accuracy_decimals: 0
    state_class: measurement
    update_interval: ${ha_interval}
    lambda: 'return id(disp_strides).state;'

  - platform: template
    name: "Session Distance"
    unit_of_measurement: ${dist_unit}
    device_class: distance
    accuracy_decimals: 2
    state_class: measurement
    update_interval: ${ha_interval}
    lambda: 'return id(disp_distance).state;'

  - platform: template
    name: "Session Calories"
    unit_of_measurement: "kcal"
    icon: mdi:fire
    accuracy_decimals: 0
    state_class: measurement
    update_interval: ${ha_interval}
    lambda: 'return id(disp_calories).state;'

  - platform: template
    name: "Session Time"
    unit_of_measurement: "s"
    device_class: duration
    icon: mdi:timer-outline
    accuracy_decimals: 0
    state_class: measurement
    update_interval: ${ha_interval}
    lambda: 'return id(session_time).state;'

  - platform: template
    name: "Total Distance"
    unit_of_measurement: ${dist_unit}
    device_class: distance
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: ${ha_interval}
    lambda: 'return id(odo_strides) * ${meters_per_stride} * ${dist_factor};'

  - platform: template
    name: "Total Calories"
    unit_of_measurement: "kcal"
    icon: mdi:fire
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: ${ha_interval}
    lambda: 'return id(odo_strides) * ${kcal_per_stride};'

  - platform: duty_time
    id: total_time
    name: "Total Pedaling Time"
    update_interval: ${ha_interval}
    sensor: is_pedaling
    restore: true
    icon: mdi:timer-sand
    last_time:
      name: "Last Pedaled"

  - platform: template
    name: "Daily Strides"
    unit_of_measurement: "strides"
    icon: mdi:shoe-print
    accuracy_decimals: 0
    state_class: measurement
    update_interval: ${ha_interval}
    lambda: 'return id(disp_day_strides).state;'

  - platform: template
    name: "Daily Distance"
    unit_of_measurement: ${dist_unit}
    device_class: distance
    accuracy_decimals: 2
    state_class: measurement
    update_interval: ${ha_interval}
    lambda: 'return id(disp_day_strides).state * ${meters_per_stride} * ${dist_factor};'

  - platform: template
    name: "Daily Calories"
    unit_of_measurement: "kcal"
    icon: mdi:fire
    accuracy_decimals: 0
    state_class: measurement
    update_interval: ${ha_interval}
    lambda: 'return id(disp_day_strides).state * ${kcal_per_stride};'

  # duty_time only refreshes on its own update_interval, so this moves in
  # ${ha_interval} steps -- which is also how often it is published.
  - platform: template
    name: "Daily Time"
    unit_of_measurement: "s"
    device_class: duration
    icon: mdi:timer-outline
    accuracy_decimals: 0
    state_class: measurement
    update_interval: ${ha_interval}
    lambda: |-
      if (isnan(id(total_time).state)) return NAN;
      float v = id(total_time).state - id(day_start_secs);
      return v < 0 ? 0.0f : v;

  - platform: template
    name: "Daily Goal Progress"
    unit_of_measurement: "%"
    icon: mdi:target
    accuracy_decimals: 0
    state_class: measurement
    update_interval: ${ha_interval}
    lambda: |-
      float goal = id(daily_goal).state;
      if (isnan(goal) || goal <= 0) return NAN;
      return 100.0f * id(disp_day_strides).state / goal;

  # Captured at rollover, so HA keeps a completed-day figure even if it was
  # not looking. If the device sat powered off for days, this is the last day
  # that actually saw pedaling, not literally yesterday.
  - platform: template
    name: "Yesterday Strides"
    unit_of_measurement: "strides"
    icon: mdi:shoe-print
    accuracy_decimals: 0
    state_class: measurement
    update_interval: ${ha_interval}
    lambda: 'return id(yesterday_strides);'

  - platform: template
    name: "Yesterday Time"
    unit_of_measurement: "s"
    device_class: duration
    icon: mdi:timer-outline
    accuracy_decimals: 0
    state_class: measurement
    update_interval: ${ha_interval}
    lambda: 'return id(yesterday_secs);'

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: template
    id: is_pedaling
    name: "Pedaling"
    device_class: moving
    icon: mdi:run
    lambda: 'return !isnan(id(stride_rate).state) && id(stride_rate).state > 0;'
    filters:
      - delayed_off: 5s
    on_press:
      - script.execute: screen_wake

  - platform: template
    name: "Daily Goal Reached"
    icon: mdi:trophy
    lambda: 'return id(day_goal_hit);'

  # Three buttons:  [<]  [>]  [SCAN/RESET]
  #   <  tap      -> previous page
  #   >  tap      -> next page
  #   O  tap      -> toggle SCAN mode
  #   O  hold 2s  -> reset session
  # While the screen is blanked, ANY button only wakes it -- including the
  # long press, so a reset can never happen on a display you can't see.
  - platform: gpio
    id: prev_button
    internal: true
    pin:
      number: ${prev_button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - if:
          condition:
            lambda: 'return id(screen_awake);'
          then:
            - switch.turn_off: scan_mode
            - script.execute: prev_page
      - script.execute: screen_wake

  - platform: gpio
    id: next_button
    internal: true
    pin:
      number: ${next_button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - if:
          condition:
            lambda: 'return id(screen_awake);'
          then:
            - switch.turn_off: scan_mode
            - script.execute: next_page
      - script.execute: screen_wake

  # No on_press here: it would fire at the START of a long press and toggle
  # SCAN on the way to a reset. Both gestures go through on_multi_click so
  # they stay mutually exclusive.
  - platform: gpio
    id: action_button
    internal: true
    pin:
      number: ${action_button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
    on_multi_click:
      - timing:
          - ON for at least 2s
        then:
          - if:
              condition:
                lambda: 'return id(screen_awake);'
              then:
                - script.execute: reset_session
              else:
                - script.execute: screen_wake

      - timing:
          - ON for at most 1s
          - OFF for at least 0.1s
        then:
          - if:
              condition:
                lambda: 'return id(screen_awake);'
              then:
                - switch.toggle: scan_mode
                - component.update: oled
          - script.execute: screen_wake

number:
  - platform: template
    id: daily_goal
    name: "Daily Stride Goal"
    icon: mdi:target
    unit_of_measurement: "strides"
    optimistic: true
    restore_value: true
    initial_value: ${daily_goal_default}
    min_value: 0
    max_value: 50000
    step: 100
    mode: box
    entity_category: config

  # Escape hatch: seed prior mileage, correct drift, or put the odometer back
  # after an NVS erase. Shifts the day and session snapshots by the same amount
  # so neither jumps when the lifetime figure does.
  - platform: template
    name: "Set Odometer"
    icon: mdi:counter
    unit_of_measurement: "strides"
    min_value: 0
    max_value: 10000000
    step: 1
    mode: box
    entity_category: config
    update_interval: ${ha_interval}
    lambda: 'return id(odo_strides);'
    set_action:
      - lambda: |-
          float delta = x - id(odo_strides);
          id(odo_strides) = x;
          id(day_start_odo) += delta;
          id(session_start_strides) += delta;
          if (id(day_start_odo) < 0) id(day_start_odo) = 0;
          if (id(session_start_strides) < 0) id(session_start_strides) = 0;
          ESP_LOGI("cubii", "odometer set to %.0f (delta %.0f)", x, delta);

font:
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_label
    size: 10

  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_value
    size: 12

  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_huge
    size: 34

  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_mid
    size: 16

display:
  - platform: ssd1306_i2c
    i2c_id: bus_a
    id: oled
    model: SSD1306_128X64
    address: 0x3c
    pages:
      # First in the list, so this is what the display comes up on.
      - id: page_daily
        lambda: |-
          // NaN for the first second after boot, before disp_day_strides runs.
          float day = isnan(id(disp_day_strides).state) ? 0.0f
                                                       : id(disp_day_strides).state;
          float goal = id(daily_goal).state;
          float frac = (isnan(goal) || goal <= 0) ? 0.0f : day / goal;
          if (frac > 1.0f) frac = 1.0f;

          it.print(0, 0, id(font_label), "TODAY");
          if (id(scan_mode).state) it.print(64, 0, id(font_label),
                                            TextAlign::TOP_CENTER, "SCAN");
          if (id(day_goal_hit))
            it.print(128, 0, id(font_label), TextAlign::TOP_RIGHT, "GOAL!");
          else
            it.printf(128, 0, id(font_label), TextAlign::TOP_RIGHT, "%.0f%%",
                      frac * 100.0f);

          it.printf(64, 30, id(font_huge), TextAlign::CENTER, "%.0f", day);

          it.rectangle(0, 52, 128, 10);
          int w = (int) (126.0f * frac + 0.5f);
          if (w > 0) it.filled_rectangle(1, 53, w, 8);

      - id: page_summary
        lambda: |-
          int t = isnan(id(session_time).state) ? 0 : (int) id(session_time).state;
          int hh = t / 3600, mm = (t % 3600) / 60, ss = t % 60;

          it.print(0, 0, id(font_label), "STRIDES");
          it.printf(128, 0, id(font_value), TextAlign::TOP_RIGHT, "%.0f",
                    id(disp_strides).state);

          it.print(0, 12, id(font_label), "TIME");
          if (hh > 0)
            it.printf(128, 12, id(font_value), TextAlign::TOP_RIGHT,
                      "%d:%02d:%02d", hh, mm, ss);
          else
            it.printf(128, 12, id(font_value), TextAlign::TOP_RIGHT,
                      "%02d:%02d", mm, ss);

          it.print(0, 24, id(font_label), "DISTANCE");
          it.printf(128, 24, id(font_value), TextAlign::TOP_RIGHT, "%.2f ${dist_unit}",
                    id(disp_distance).state);

          it.print(0, 36, id(font_label), "CALORIES");
          it.printf(128, 36, id(font_value), TextAlign::TOP_RIGHT, "%.0f",
                    id(disp_calories).state);

          it.print(0, 48, id(font_label), "RPM");
          it.printf(128, 48, id(font_value), TextAlign::TOP_RIGHT, "%.0f",
                    isnan(id(stride_rate).state) ? 0.0f : id(stride_rate).state);

          if (id(is_pedaling).state) it.filled_rectangle(0, 61, 40, 3);
          if (id(scan_mode).state) it.print(128, 60, id(font_label),
                                            TextAlign::BASELINE_RIGHT, "SCAN");

      - id: page_strides
        lambda: |-
          it.print(64, 2, id(font_label), TextAlign::TOP_CENTER, "STRIDES");
          it.printf(64, 36, id(font_huge), TextAlign::CENTER, "%.0f",
                    id(disp_strides).state);
          if (id(scan_mode).state) it.print(128, 63, id(font_label),
                                            TextAlign::BASELINE_RIGHT, "SCAN");

      - id: page_time
        lambda: |-
          int t = isnan(id(session_time).state) ? 0 : (int) id(session_time).state;
          int hh = t / 3600, mm = (t % 3600) / 60, ss = t % 60;
          it.print(64, 2, id(font_label), TextAlign::TOP_CENTER, "TIME");
          if (hh > 0)
            it.printf(64, 36, id(font_mid), TextAlign::CENTER, "%d:%02d:%02d",
                      hh, mm, ss);
          else
            it.printf(64, 36, id(font_huge), TextAlign::CENTER, "%02d:%02d",
                      mm, ss);
          if (id(scan_mode).state) it.print(128, 63, id(font_label),
                                            TextAlign::BASELINE_RIGHT, "SCAN");

      - id: page_calories
        lambda: |-
          it.print(64, 2, id(font_label), TextAlign::TOP_CENTER, "CALORIES");
          it.printf(64, 36, id(font_huge), TextAlign::CENTER, "%.0f",
                    id(disp_calories).state);
          if (id(scan_mode).state) it.print(128, 63, id(font_label),
                                            TextAlign::BASELINE_RIGHT, "SCAN");

      - id: page_distance
        lambda: |-
          it.print(64, 2, id(font_label), TextAlign::TOP_CENTER, "DISTANCE");
          it.printf(64, 34, id(font_huge), TextAlign::CENTER, "%.2f",
                    id(disp_distance).state);
          it.print(64, 62, id(font_label), TextAlign::BASELINE_CENTER, "${dist_unit}");
          if (id(scan_mode).state) it.print(128, 63, id(font_label),
                                            TextAlign::BASELINE_RIGHT, "SCAN");

      - id: page_rpm
        lambda: |-
          it.print(64, 2, id(font_label), TextAlign::TOP_CENTER, "RPM");
          it.printf(64, 36, id(font_huge), TextAlign::CENTER, "%.0f",
                    isnan(id(stride_rate).state) ? 0.0f : id(stride_rate).state);
          if (id(scan_mode).state) it.print(128, 63, id(font_label),
                                            TextAlign::BASELINE_RIGHT, "SCAN");

      - id: page_reset
        lambda: |-
          it.print(64, 20, id(font_mid), TextAlign::CENTER, "SESSION");
          it.print(64, 42, id(font_mid), TextAlign::CENTER, "RESET");

script:
  # Recompute the three display sensors and repaint, in that order. Called
  # from total_strides' on_value (once per stride) and from reset_session.
  # The 1s update_interval on those sensors stays as a safety net for boot
  # and for anything that changes while the wheel is stopped.
  - id: refresh_display
    mode: single
    then:
      - component.update: disp_strides
      - component.update: disp_distance
      - component.update: disp_calories
      - component.update: oled

  # page_reset lives in the same page list, so both directions step over it.
  - id: prev_page
    mode: restart
    then:
      - display.page.show_previous: oled
      - if:
          condition:
            lambda: 'return id(oled).get_active_page() == id(page_reset);'
          then:
            - display.page.show_previous: oled
      - component.update: oled

  - id: next_page
    mode: restart
    then:
      - display.page.show_next: oled
      - if:
          condition:
            lambda: 'return id(oled).get_active_page() == id(page_reset);'
          then:
            - display.page.show: page_daily
      - component.update: oled

  # mode: restart means every call cancels the pending blank and starts the
  # countdown over -- that's the whole idle timer.
  - id: screen_wake
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(screen_awake);'
          then:
            - lambda: |-
                id(oled).turn_on();
                id(screen_awake) = true;
      - delay: ${screen_timeout}
      - lambda: |-
          id(oled).turn_off();
          id(screen_awake) = false;

  # Compares a stored date against the clock rather than firing on_time at the
  # reset hour, so a boundary crossed while the device was powered off still
  # rolls -- on the next boot, as soon as the clock is valid.
  - id: check_rollover
    mode: single
    then:
      - lambda: |-
          auto t = id(sntp_time).now();
          if (!t.is_valid()) return;

          // Shift the epoch back by the reset hour, then take the local date:
          // everything before ${daily_reset_hour}:00 belongs to the day before.
          ESPTime lt = ESPTime::from_epoch_local(t.timestamp - ${daily_reset_hour} * 3600);
          uint32_t stamp = lt.year * 10000u + lt.month * 100u + lt.day_of_month;

          float odo  = id(odo_strides);
          float secs = isnan(id(total_time).state) ? 0.0f : id(total_time).state;

          if (id(day_stamp) == 0) {
            // First valid clock ever. Adopt today without inventing a yesterday.
            id(day_stamp) = stamp;
            id(day_start_odo) = odo;
            id(day_start_secs) = secs;
            ESP_LOGI("cubii", "daily counters start at %u", (unsigned) stamp);
            return;
          }

          if (stamp == id(day_stamp)) return;

          uint32_t prev = id(day_stamp);
          id(yesterday_strides) = odo - id(day_start_odo);
          id(yesterday_secs) = secs - id(day_start_secs);
          if (id(yesterday_strides) < 0) id(yesterday_strides) = 0;
          if (id(yesterday_secs) < 0) id(yesterday_secs) = 0;
          id(day_start_odo) = odo;
          id(day_start_secs) = secs;
          id(day_goal_hit) = false;
          id(day_stamp) = stamp;
          ESP_LOGI("cubii", "daily rollover %u -> %u, closed out at %.0f strides",
                   (unsigned) prev, (unsigned) stamp, id(yesterday_strides));

  - id: reset_session
    mode: restart
    then:
      - script.execute: screen_wake
      - lambda: |-
          id(session_start_strides) = id(odo_strides);
          ESP_LOGI("cubii", "session reset at %.0f lifetime strides",
                   id(session_start_strides));
      - sensor.duty_time.reset: session_time
      - script.execute: refresh_display
      - display.page.show: page_reset
      - component.update: oled
      - display.page.show: page_summary
      - component.update: oled

interval:
  - interval: ${scan_interval}
    then:
      - if:
          condition:
            and:
              - switch.is_on: scan_mode
              - lambda: 'return id(screen_awake);'
              - not:
                  lambda: 'return id(oled).get_active_page() == id(page_reset);'
          then:
            - script.execute: next_page

  - interval: 60s
    then:
      - script.execute: check_rollover

  # Re-arm the idle timer while pedaling, so a long session never blanks.
  - interval: 30s
    then:
      - if:
          condition:
            binary_sensor.is_on: is_pedaling
          then:
            - script.execute: screen_wake

button:
  - platform: template
    name: "Reset Session"
    icon: mdi:restart
    on_press:
      - script.execute: reset_session

  - platform: restart
    name: "Restart"
    entity_category: config