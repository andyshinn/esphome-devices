substitutions:
  esphome_name: garage-ble-proxy
  friendly_name: Garage BLE Proxy

esphome:
  name: ${esphome_name}
  friendly_name: ${friendly_name}

esp32:
  board: adafruit_feather_esp32_v2
  framework:
    type: esp-idf

wifi:
  ssid: NotProgrium
  password: !secret wifi_password

logger:
  level: NONE
  baud_rate: 0

api:
  reboot_timeout: 60min
  encryption:
    key: !secret api_key_garage_ble_proxy

ota:
  - platform: esphome
    password: !secret wifi_password

time:
  - platform: homeassistant
    id: homeassistant_time

bluetooth_proxy:
  active: true
  id: garage_ble_proxy
