substitutions:
  on_speed: 100
  led_brightness: "0.25"
  pump_delay: "5s"
  pump_run_timeout: "60"

esphome:
  name: halloween-cauldron-pumps
  on_boot:
    priority: -100
    then:
      - output.turn_on: neopixel_i2c_power
      - delay: 100ms
      - script.execute: update_led

  friendly_name: Cauldron Pumps
esp32:
  board: adafruit_feather_esp32_v2
  framework:
    type: esp-idf
  variant: esp32


i2c:
  id: i2c_bus
  sda: SDA
  scl: SCL

wifi:
  ssid: "NotProgrium"
  password: !secret wifi_password

api:
  reboot_timeout: 60min
  encryption:
    key: !secret halloween_cauldron_pumps__encryption_key
ota:
  - platform: esphome
    encryption:

web_server:
  version: 3
  port: 80

logger:
  level: DEBUG

sensor:
  - platform: adc
    pin: GPIO35
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: 60s
    attenuation: 12dB
    filters:
      - multiply: 2.0
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
  - platform: template
    name: "Battery Percentage"
    id: battery_percentage
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement
    lambda: |-
      float voltage = id(battery_voltage).state;
      if (voltage >= 4.2) return 100.0;
      if (voltage <= 3.0) return 0.0;
      return (voltage - 3.0) / (4.2 - 3.0) * 100.0;
    update_interval: 60s

binary_sensor:
  - platform: gpio
    name: "Level Sensor Pump 1"
    id: level_sensor_pump1
    device_class: running
    filters:
      # Off passes immediately. A symmetric delay never fires if sloshing keeps
      # the float bouncing, which leaves the pump running.
      - delayed_on: ${pump_delay}
    pin:
      number: D14
      inverted: true
      mode:
        input: true
        pullup: true
  - platform: gpio
    name: "Level Sensor Pump 2"
    id: level_sensor_pump2
    device_class: running
    filters:
      # Off passes immediately. A symmetric delay never fires if sloshing keeps
      # the float bouncing, which leaves the pump running.
      - delayed_on: ${pump_delay}
    pin:
      number: D32
      inverted: true
      mode:
        input: true
        pullup: true
  - platform: gpio
    name: "Level Sensor Pump 3"
    id: level_sensor_pump3
    device_class: running
    filters:
      # Off passes immediately. A symmetric delay never fires if sloshing keeps
      # the float bouncing, which leaves the pump running.
      - delayed_on: ${pump_delay}
    pin:
      number: D15
      inverted: true
      mode:
        input: true
        pullup: true
  - platform: gpio
    name: "Level Sensor Pump 4"
    id: level_sensor_pump4
    device_class: running
    filters:
      # Off passes immediately. A symmetric delay never fires if sloshing keeps
      # the float bouncing, which leaves the pump running.
      - delayed_on: ${pump_delay}
    pin:
      number: D33
      inverted: true
      mode:
        input: true
        pullup: true
  - platform: template
    name: "Any Pump Running"
    id: any_pump_running
    device_class: running
    lambda: |-
      return id(pump1).state ||
             id(pump2).state ||
             id(pump3).state ||
             id(pump4).state;
    on_state:
      then:
        - script.execute: update_led
  - platform: template
    name: "Pump Fault"
    id: pump_fault
    device_class: problem
    lambda: |-
      if (id(pca9685_halloween).is_failed())
        return true;
      for (bool locked : id(pump_locked)) {
        if (locked)
          return true;
      }
      return false;
    on_state:
      then:
        - script.execute: update_led

switch:
  - platform: template
    name: "Auto Refill"
    id: auto_refill
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      then:
        - fan.turn_off: pump1
        - fan.turn_off: pump2
        - fan.turn_off: pump3
        - fan.turn_off: pump4
  - platform: template
    name: "Pump 1 Manual Override"
    id: pump1_manual
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    name: "Pump 2 Manual Override"
    id: pump2_manual
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    name: "Pump 3 Manual Override"
    id: pump3_manual
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    name: "Pump 4 Manual Override"
    id: pump4_manual
    optimistic: true
    restore_mode: ALWAYS_OFF

button:
  - platform: template
    name: "Reset Pump Fault"
    on_press:
      then:
        - lambda: id(pump_locked).fill(false);

globals:
  - id: pump_locked
    type: std::array<bool, 4>

script:
  - id: update_led
    then:
      - lambda: |-
          // Purple = fault, green = pumping, red = idle
          auto call = id(rgb_indicator).turn_on();
          call.set_brightness(${led_brightness});
          if (id(pump_fault).state) {
            call.set_rgb(1.0, 0.0, 1.0);
          } else if (id(any_pump_running).state) {
            call.set_rgb(0.0, 1.0, 0.0);
          } else {
            call.set_rgb(1.0, 0.0, 0.0);
          }
          call.perform();

# Only place pumps are started or stopped by level. Compares desired and actual
# state every tick, so a missed edge can't leave a pump on. Manual pumps skip the
# level check but still stop at the run timeout.
interval:
  - interval: 1s
    then:
      - lambda: |-
          fan::Fan *pumps[] = {id(pump1), id(pump2), id(pump3), id(pump4)};
          binary_sensor::BinarySensor *levels[] = {id(level_sensor_pump1), id(level_sensor_pump2),
                                                   id(level_sensor_pump3), id(level_sensor_pump4)};
          switch_::Switch *manual[] = {id(pump1_manual), id(pump2_manual), id(pump3_manual), id(pump4_manual)};
          auto &locked = id(pump_locked);
          static uint16_t run_seconds[4] = {};

          for (int i = 0; i < 4; i++) {
            const bool running = pumps[i]->state;
            const bool automatic = id(auto_refill).state && !manual[i]->state;

            // Counts the current run only, so every start gets the full timeout.
            run_seconds[i] = running ? run_seconds[i] + 1 : 0;
            const bool timed_out = run_seconds[i] >= ${pump_run_timeout};
            if (timed_out)
              ESP_LOGW("pump", "Pump %d reached the ${pump_run_timeout}s run timeout", i + 1);

            // A low level would restart the pump on the next tick, so in auto it
            // stays off until the level recovers. Manual pumps can restart right away.
            if (timed_out && automatic) {
              locked[i] = true;
            } else if (!automatic || !levels[i]->state) {
              locked[i] = false;
            }

            const bool want = !timed_out && !locked[i] && (automatic ? levels[i]->state : running);
            if (want == running)
              continue;
            if (want) {
              auto call = pumps[i]->turn_on();
              call.set_speed(${on_speed});
              call.perform();
            } else {
              pumps[i]->turn_off().perform();
            }
          }

          // Failed writes mean a pump may not stop. A reboot recovers the I2C bus and
          // re-inits the PCA9685. If that fails, is_failed() reports a fault with no reboot loop.
          static uint8_t pca_error_seconds = 0;
          pca_error_seconds = id(pca9685_halloween).status_has_warning() ? pca_error_seconds + 1 : 0;
          if (pca_error_seconds >= 10) {
            ESP_LOGE("pump", "PCA9685 writes failing, rebooting");
            App.safe_reboot();
          }

pca9685:
  id: pca9685_halloween
  address: 0x60
  frequency: 200Hz

output:
  - platform: pca9685
    channel: 8
    id: ic1_pwma
  - platform: pca9685
    channel: 9
    id: ic1_ain2
  - platform: pca9685
    channel: 10
    id: ic1_ain1
  - platform: pca9685
    channel: 13
    id: ic1_pwmb
  - platform: pca9685
    channel: 12
    id: ic1_bin2
  - platform: pca9685
    channel: 11
    id: ic1_bin1
  - platform: pca9685
    channel: 2
    id: ic3_pwma
  - platform: pca9685
    channel: 3
    id: ic3_ain2
  - platform: pca9685
    channel: 4
    id: ic3_ain1
  - platform: pca9685
    channel: 7
    id: ic3_pwmb
  - platform: pca9685
    channel: 6
    id: ic3_bin2
  - platform: pca9685
    channel: 5
    id: ic3_bin1
  - platform: gpio
    id: neopixel_i2c_power
    pin:
      number: GPIO2
      mode:
        output: true


fan:
  - platform: hbridge
    id: pump1
    name: "Refill Pump 1"
    pin_a: ic1_ain1
    pin_b: ic1_ain2
    enable_pin: ic1_pwma
    decay_mode: slow
  - platform: hbridge
    id: pump2
    name: "Refill Pump 2"
    pin_a: ic1_bin1
    pin_b: ic1_bin2
    enable_pin: ic1_pwmb
    decay_mode: slow
  - platform: hbridge
    id: pump3
    name: "Refill Pump 3"
    pin_a: ic3_ain1
    pin_b: ic3_ain2
    enable_pin: ic3_pwma
    decay_mode: slow
  - platform: hbridge
    id: pump4
    name: "Refill Pump 4"
    pin_a: ic3_bin1
    pin_b: ic3_bin2
    enable_pin: ic3_pwmb
    decay_mode: slow


light:
  - platform: esp32_rmt_led_strip
    id: rgb_indicator
    channel_colors: GRB
    pin: NEOPIXEL
    num_leds: 1
    chipset: ws2812
    name: "RGB Indicator"
