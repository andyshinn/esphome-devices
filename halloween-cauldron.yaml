substitutions:
  on_speed: 100
  led_brightness: "0.25"
  pump_delay: "5s"

esphome:
  name: halloween-cauldron-pumps
  on_boot:
    priority: -100
    then:
      - output.turn_on: neopixel_i2c_power
      - delay: 100ms
      - lambda: |-
          // Set LED based on pump status
          if (id(any_pump_running).state) {
            auto call = id(rgb_indicator).turn_on();
            call.set_brightness(${led_brightness});
            call.set_rgb(0.0, 1.0, 0.0);
            call.perform();
          } else {
            auto call = id(rgb_indicator).turn_on();
            call.set_brightness(${led_brightness});
            call.set_rgb(1.0, 0.0, 0.0);
            call.perform();
          }

esp32:
  board: adafruit_feather_esp32_v2
  framework:
    type: esp-idf
  variant: esp32


i2c:
  id: i2c_bus
  sda: SDA
  scl: SCL

wifi:
  ssid: "NotProgrium"
  password: !secret wifi_password

api:
  reboot_timeout: 60min
  encryption:
    key: !secret api_key_halloween_cauldron

ota:
  - platform: esphome
    password: !secret wifi_password

web_server:
  version: 3
  port: 80

logger:
  level: DEBUG

sensor:
  - platform: adc
    pin: GPIO35
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: 60s
    attenuation: 12dB
    filters:
      - multiply: 2.0
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
  - platform: template
    name: "Battery Percentage"
    id: battery_percentage
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement
    lambda: |-
      float voltage = id(battery_voltage).state;
      if (voltage >= 4.2) return 100.0;
      if (voltage <= 3.0) return 0.0;
      return (voltage - 3.0) / (4.2 - 3.0) * 100.0;
    update_interval: 60s

binary_sensor:
  - platform: gpio
    name: "Level Sensor Pump 1"
    id: level_sensor_pump1
    device_class: running
    filters:
      - delayed_on_off: ${pump_delay}
    pin:
      number: D14
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - fan.turn_on:
            id: pump1
            speed: ${on_speed}
    on_release:
      then:
        - fan.turn_off:
            id: pump1
  - platform: gpio
    name: "Level Sensor Pump 2"
    id: level_sensor_pump2
    device_class: running
    filters:
      - delayed_on_off: ${pump_delay}
    pin:
      number: D32
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - fan.turn_on:
            id: pump2
            speed: ${on_speed}
    on_release:
      then:
        - fan.turn_off:
            id: pump2
  - platform: gpio
    name: "Level Sensor Pump 3"
    id: level_sensor_pump3
    device_class: running
    filters:
      - delayed_on_off: ${pump_delay}
    pin:
      number: D15
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - fan.turn_on:
            id: pump3
            speed: ${on_speed}
    on_release:
      then:
        - fan.turn_off:
            id: pump3
  - platform: gpio
    name: "Level Sensor Pump 4"
    id: level_sensor_pump4
    device_class: running
    filters:
      - delayed_on_off: ${pump_delay}
    pin:
      number: D33
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - fan.turn_on:
            id: pump4
            speed: ${on_speed}
    on_release:
      then:
        - fan.turn_off:
            id: pump4
  - platform: template
    name: "Any Pump Running"
    id: any_pump_running
    device_class: running
    lambda: |-
      return id(level_sensor_pump1).state ||
             id(level_sensor_pump2).state ||
             id(level_sensor_pump3).state ||
             id(level_sensor_pump4).state;
    on_press:
      then:
        - light.turn_on:
            id: rgb_indicator
            brightness: ${led_brightness}
            red: 0%
            green: 100%
            blue: 0%
    on_release:
      then:
        - light.turn_on:
            id: rgb_indicator
            brightness: ${led_brightness}
            red: 100%
            green: 0%
            blue: 0%

pca9685:
  id: pca9685_halloween
  address: 0x60
  frequency: 200Hz

output:
  - platform: pca9685
    channel: 8
    id: ic1_pwma
  - platform: pca9685
    channel: 9
    id: ic1_ain2
  - platform: pca9685
    channel: 10
    id: ic1_ain1
  - platform: pca9685
    channel: 13
    id: ic1_pwmb
  - platform: pca9685
    channel: 12
    id: ic1_bin2
  - platform: pca9685
    channel: 11
    id: ic1_bin1
  - platform: pca9685
    channel: 2
    id: ic3_pwma
  - platform: pca9685
    channel: 3
    id: ic3_ain2
  - platform: pca9685
    channel: 4
    id: ic3_ain1
  - platform: pca9685
    channel: 7
    id: ic3_pwmb
  - platform: pca9685
    channel: 6
    id: ic3_bin2
  - platform: pca9685
    channel: 5
    id: ic3_bin1
  - platform: gpio
    id: neopixel_i2c_power
    pin:
      number: GPIO2
      mode:
        output: true


fan:
  - platform: hbridge
    id: pump1
    name: "Refill Pump 1"
    pin_a: ic1_ain1
    pin_b: ic1_ain2
    enable_pin: ic1_pwma
    decay_mode: slow
  - platform: hbridge
    id: pump2
    name: "Refill Pump 2"
    pin_a: ic1_bin1
    pin_b: ic1_bin2
    enable_pin: ic1_pwmb
    decay_mode: slow
  - platform: hbridge
    id: pump3
    name: "Refill Pump 3"
    pin_a: ic3_ain1
    pin_b: ic3_ain2
    enable_pin: ic3_pwma
    decay_mode: slow
  - platform: hbridge
    id: pump4
    name: "Refill Pump 4"
    pin_a: ic3_bin1
    pin_b: ic3_bin2
    enable_pin: ic3_pwmb
    decay_mode: slow


light:
  - platform: esp32_rmt_led_strip
    id: rgb_indicator
    rgb_order: GRB
    pin: NEOPIXEL
    num_leds: 1
    chipset: ws2812
    name: "RGB Indicator"
